<style>
:root{--green:#1f4d3a;--gold:#c9a24a;--paper:#fbf6e6;--ink:#1b1a17;--bar:#173a2b;--soft:#e9e1cc;--bw:52px;--veil:.78;--z:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--soft);color:var(--ink);font-family:Amiri,serif;overflow:hidden;touch-action:manipulation;
 --pt:calc(env(safe-area-inset-top,0px) + 100px);--pb:calc(env(safe-area-inset-bottom,0px) + 96px)}
button,select,input{font-family:inherit}
header{position:fixed;top:0;left:0;right:0;z-index:6;background:linear-gradient(var(--bar),color-mix(in srgb,var(--bar) 88%,#000));color:#fff;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 8px;border-radius:0 0 18px 18px;box-shadow:0 4px 16px #0005;transition:transform .28s}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:20px;color:var(--gold)}
.brand b{margin-left:6px;font-size:23px}
.tb{display:flex;gap:6px}
.tb button{width:36px;height:36px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff14;color:#fff;font-size:17px;padding:0}
.sel{display:flex;gap:6px;margin-top:6px}
.sel select{flex:1;min-width:0;font-size:15px;border:1px solid #ffffff44;background:#ffffff14;color:#fff;border-radius:10px;padding:6px 4px}
.sel select option{color:#000}
footer{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;z-index:6;background:color-mix(in srgb,var(--bar) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #ffffff2a;border-radius:22px;padding:7px;display:flex;gap:6px;justify-content:space-between;box-shadow:0 6px 20px #0006;transition:transform .28s}
footer button{flex:1;font-size:15px;color:#fff;background:none;border:0;border-radius:16px;padding:9px 4px;line-height:1.25}
footer button i{display:block;font-style:normal;font-size:19px}
footer .play{flex:1.5;background:var(--gold);color:#1b1a17;font-weight:700}
body.hide header{transform:translateY(-120%)}body.hide footer{transform:translateY(160%)}
#mushaf{height:100vh;height:100dvh;display:flex;direction:rtl;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
#mushaf::-webkit-scrollbar{display:none}
body.zoom #mushaf{overflow-x:hidden;scroll-snap-type:none}
.mp{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;overflow:hidden;direction:ltr;padding:var(--pt) 0 var(--pb)}
.mp.zm{overflow:auto;-webkit-overflow-scrolling:touch}
.pg{margin:auto;flex:none;direction:rtl;display:flex;flex-direction:column;align-items:stretch;transition:transform .28s;transform-origin:center}
body.hide .pg{transform:translateY(var(--hty,0px)) scale(var(--hsmax,1))}
body.zoom .pg{transform:none!important}
.mph{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--green);padding:0 8px 5px;font-weight:700}
.mpn{text-align:center;font-size:18px;color:var(--green);padding-top:4px;line-height:1.25;font-weight:700}
.rg{font-size:13px;font-weight:400;opacity:.85;display:block}
.fr{position:relative;flex:none;border:calc(var(--bw)/2) solid transparent;border-image:var(--fi) 40/calc(var(--bw)/2) round;background:var(--paper);box-shadow:0 8px 22px #0004}
html[data-frame=plain] .fr{border:10px double var(--gold);border-image:none}
html[data-frame=none] .fr{border:0;border-image:none;box-shadow:0 2px 12px #0003}
html[data-frame=plain]{--bw:20px}html[data-frame=none]{--bw:0px}
.in{position:relative;background:var(--paper);border:2px solid var(--green);outline:1.5px solid var(--gold);outline-offset:-5px;aspect-ratio:1920/3106;
 width:calc(min(100vw - var(--bw) - 36px,(100dvh - var(--pt) - var(--pb) - 76px - var(--bw))*.6182)*var(--z));overflow:hidden}
html[data-frame=none] .in{border:0;outline:0}
.in img{display:block;width:100%;height:100%;mix-blend-mode:multiply;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
html[data-inv="1"] .in img{filter:invert(1);mix-blend-mode:screen}
.vl{position:absolute;background:var(--paper);opacity:var(--veil);pointer-events:none}
.hl{position:absolute;background:rgba(201,162,74,.40);pointer-events:none;mix-blend-mode:multiply;border-radius:3px}
html[data-inv="1"] .hl{background:rgba(201,162,74,.5);mix-blend-mode:screen}
@media (orientation:landscape) and (max-height:560px){
 .in{width:calc(min(100vw - var(--bw) - 160px,620px)*var(--z))}
 .mp{overflow-y:auto}
 body.hide .pg{transform:none}
}
.sbtn{font-size:16px;font-weight:700;color:var(--green);background:color-mix(in srgb,var(--gold) 22%,transparent);border:1px solid var(--gold);border-radius:10px;padding:1px 12px}
#msg{margin:auto;text-align:center;padding:30px 10px;font-size:20px}
#np{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#173a2bee;color:#fff;border:1px solid var(--gold);border-radius:20px;padding:4px 14px;font-size:15px;z-index:5;display:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:#000c;color:#fff;border-radius:18px;padding:6px 16px;font-size:16px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;max-height:78vh;overflow:auto;background:var(--paper);color:var(--ink);border-top:3px solid var(--gold);border-radius:20px 20px 0 0;padding:0 16px 24px;font-size:17px;line-height:1.8;overscroll-behavior:contain;transform:translateY(105%);transition:transform .25s;z-index:9;box-shadow:0 -6px 24px #0005}
.sheet.open{transform:none}
.sheet .sh{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:700;font-size:20px;color:var(--green);gap:8px}
.sheet .sh>div{display:flex;gap:8px;align-items:center}
.sheet .sh button{border:1px solid var(--gold);background:none;color:var(--ink);border-radius:10px;padding:2px 12px;font-size:16px}
.sheet p{margin:8px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}.sheet b{color:#a8832f}
.sheet p.sp{background:#c9a24a33;border-radius:8px}
.mini{border:0!important;background:none!important;font-size:18px!important;padding:0 6px!important}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:4px}
.sg button{font-size:17px;background:none;border:1px solid #c9a24a66;border-radius:10px;padding:6px 4px;color:var(--ink)}
.sg small{color:#a8832f}
.rb{display:flex;flex-direction:column;width:100%;text-align:right;font-size:18px;line-height:1.7;background:#c9a24a30;border:1px solid #c9a24a;border-radius:12px;padding:8px 12px;margin:8px 0;color:var(--ink)}
.rb.cur{background:#c9a24a66;box-shadow:inset 0 0 0 2px var(--green)}
.rb span{font-size:16px;opacity:.85}
.st h4{margin:14px 0 6px;color:var(--green);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:16px;border:1.5px solid #c9a24a88;background:none;border-radius:12px;padding:6px 12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.chip.on{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green);background:#c9a24a30;font-weight:700}
.sw{width:34px;height:20px;border-radius:5px;border:1px solid #0004}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;padding:4px 0}
.row input[type=range]{flex:1;accent-color:var(--green)}
.tg{width:50px;height:28px;border-radius:14px;border:0;background:#8885;position:relative}
.tg::after{content:'';position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--green)}.tg.on::after{right:25px}
.bar{height:10px;border-radius:5px;background:#8883;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.btn{font-size:17px;border:1.5px solid var(--green);background:var(--green);color:#fff;border-radius:12px;padding:6px 14px}
.btn.o{background:none;color:var(--ink);border-color:#c9a24a}
.qi{display:flex;gap:8px;margin-bottom:6px}.qi input{flex:1;font-size:18px;border:1.5px solid var(--gold);background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 10px;min-width:0}
#bk{position:fixed;inset:0;background:#0006;z-index:8;opacity:0;pointer-events:none;transition:opacity .25s}#bk.on{opacity:1;pointer-events:auto}
#sel{position:fixed;left:10px;right:10px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:7;display:none;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:#173a2bf2;color:#fff;border:1px solid var(--gold);border-radius:18px;padding:6px 8px;font-size:15px}
#sel span{flex:1 0 100%;text-align:center;color:var(--gold);font-weight:700}
#sel button{font-size:15px;color:#fff;background:#ffffff1f;border:1px solid #ffffff44;border-radius:12px;padding:6px 10px}
#sel button.p{background:var(--gold);color:#1b1a17;font-weight:700;border-color:var(--gold)}
.btn:disabled{opacity:.5}
#tbody,#acB p{font-size:var(--tfs,16px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffd76a}
</style>
</head>
<body>
<header id="hd">
  <div class="top"><div class="brand"><b>۞</b>مصحف التراويح</div><div class="tb"><button id="srch" aria-label="بحث">🔍</button><button id="theme" aria-label="الوضع الليلي">◐</button><button id="gear" aria-label="الإعدادات">⚙</button></div></div>
  <div class="sel"><select id="juz" aria-label="الجزء"></select><select id="rub" aria-label="الربع"></select><select id="rec" aria-label="القارئ">
    <option value="Alafasy_128kbps">العفاسي</option><option value="Husary_128kbps">الحصري</option><option value="Abdul_Basit_Murattal_192kbps">عبد الباسط</option><option value="Minshawy_Murattal_128kbps">المنشاوي</option><option value="Abdurrahmaan_As-Sudais_192kbps">السديس</option><option value="Saood_ash-Shuraym_128kbps">الشريم</option><option value="Hudhaify_128kbps">الحذيفي</option><option value="Maher_AlMuaqily_64kbps">ماهر المعيقلي</option></select></div>
</header>
<div id="mushaf"></div>
<div id="np"></div><div id="toast"></div><div id="bk"></div>
<div id="sel"><span id="selT"></span><button class="p" onclick="startSel()">▶ ابدأ من هنا</button><button onclick="copyText(ayahText(selI))">نسخ</button><button onclick="ayahSheet(selI)">التفسير</button><button onclick="clearSel()">✕</button></div>
<footer id="ft">
  <button id="prev"><i>→</i>السابق</button>
  <button class="play" id="play"><i>▶</i>استماع</button>
  <button id="tf"><i>☰</i>التفسير</button>
  <button id="next"><i>←</i>التالي</button>
</footer>
<div id="sheet" class="sheet"><div class="sh"><span>التفسير الميسر</span><div><button id="tall">🔊 استماع</button><button id="tc">إغلاق</button></div></div><div id="tbody"></div></div>
<div id="ssheet" class="sheet"><div class="sh"><div><button id="sback" style="display:none">→ السور</button><span id="stitle">اختر السورة</span></div><button id="sc">إغلاق</button></div><div id="sbody"></div></div>
<div id="set" class="sheet st"><div class="sh"><span>الإعدادات</span><button id="setc">إغلاق</button></div><div id="setb"></div></div>
<div id="srsheet" class="sheet"><div class="sh"><span>بحث في القرآن</span><button id="src">إغلاق</button></div><div class="qi"><input id="qi" type="search" placeholder="اكتب كلمة…" enterkeyhint="search"><button class="btn" id="qgo">بحث</button></div><div id="qres"></div></div>
<div id="act" class="sheet"><div class="sh"><span id="acT"></span><button id="acx">إغلاق</button></div><div id="acB"></div></div>
<audio id="aud" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id), API='https://api.alquran.cloud/v1/', AQ=API+'hizbQuarter/';
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]), p3=n=>String(n).padStart(3,'0');
const RUB_NAMES=['الربع الأول','الربع الثاني','الربع الثالث','الربع الرابع','الربع الخامس','الربع السادس','الربع السابع','الربع الثامن'];
const SN="الفاتحة،البقرة،آل عمران،النساء،المائدة،الأنعام،الأعراف،الأنفال،التوبة،يونس،هود،يوسف،الرعد،إبراهيم،الحجر،النحل،الإسراء،الكهف،مريم،طه،الأنبياء،الحج،المؤمنون،النور،الفرقان،الشعراء،النمل،القصص،العنكبوت،الروم،لقمان،السجدة،الأحزاب،سبأ،فاطر،يس،الصافات،ص،الزمر،غافر،فصلت،الشورى،الزخرف،الدخان،الجاثية،الأحقاف،محمد،الفتح،الحجرات،ق،الذاريات،الطور،النجم،القمر،الرحمن،الواقعة،الحديد،المجادلة،الحشر،الممتحنة،الصف،الجمعة،المنافقون،التغابن،الطلاق،التحريم،الملك،القلم،الحاقة،المعارج،نوح،الجن،المزمل،المدثر،القيامة،الإنسان،المرسلات،النبأ،النازعات،عبس،التكوير،الانفطار،المطففين،الانشقاق،البروج،الطارق،الأعلى،الغاشية،الفجر،البلد،الشمس،الليل،الضحى،الشرح،التين،العلق،القدر،البينة،الزلزلة،العاديات،القارعة،التكاثر،العصر،الهمزة،الفيل،قريش،الماعون،الكوثر،الكافرون،النصر،المسد،الإخلاص،الفلق،الناس".split('،');
const JUZ=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون','الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون'];
const TH={light:{n:'فاتح',soft:'#e9e1cc',paper:'#fbf6e6',bar:'#173a2b',ink:'#1b1a17',green:'#1f4d3a',gold:'#c9a24a',inv:0},
 paper:{n:'ورقي',soft:'#d8c7a0',paper:'#f4e8cb',bar:'#4a3520',ink:'#2a1d0e',green:'#5a3d1e',gold:'#b8862f',inv:0},
 white:{n:'أبيض',soft:'#eceff2',paper:'#ffffff',bar:'#1d3b4f',ink:'#111111',green:'#1d3b4f',gold:'#c9a24a',inv:0},
 night:{n:'ليلي',soft:'#0b0e0f',paper:'#161a1c',bar:'#0b1112',ink:'#e9e4d4',green:'#8fcfae',gold:'#c9a24a',inv:1}};
const PAL={green:{n:'أخضر وردي',bg:'#b3d9aa',vine:'#5aa55f',pt:'#ec9fc2',ps:'#c4558a',ln:'#2c6a45',lf:'#5aa55f',md:'#7fbf86',ct:'#fbe9a6',cs:'#c9a24a',cd:'#b0457f'},
 gold:{n:'ذهبي',bg:'#f0dca0',vine:'#b8902f',pt:'#fff4d2',ps:'#a67c1f',ln:'#6b4b0f',lf:'#c9a24a',md:'#e4c46b',ct:'#7a4b12',cs:'#6b4b0f',cd:'#fff2c9'},
 blue:{n:'أزرق',bg:'#bcd9e8',vine:'#3f86a8',pt:'#f6d98b',ps:'#b58a2a',ln:'#1d4d6b',lf:'#3f86a8',md:'#86bcd6',ct:'#fff4cf',cs:'#b58a2a',cd:'#1d4d6b'},
 wine:{n:'عنابي',bg:'#ebc9ce',vine:'#a8505f',pt:'#fbe9a6',ps:'#c9a24a',ln:'#6d1f33',lf:'#9c4a58',md:'#cf98a2',ct:'#6d1f33',cs:'#c9a24a',cd:'#fbe9a6'}};
function frameSVG(c){
  const pet=(n,rx,ry,cy)=>[...Array(n)].map((_,k)=>`<ellipse cx='20' cy='${cy}' rx='${rx}' ry='${ry}' transform='rotate(${k*360/n} 20 20)' fill='${c.pt}' stroke='${c.ps}' stroke-width='.6'/>`).join('');
  const E=`<g id='E'><rect width='40' height='40' fill='${c.bg}'/><path d='M0 8L20 20L0 32M40 8L20 20L40 32' fill='none' stroke='#fff' stroke-opacity='.55' stroke-width='.9'/><path d='M0 12Q10 6 20 12T40 12M0 28Q10 34 20 28T40 28' fill='none' stroke='${c.vine}' stroke-width='.9'/><ellipse cx='7' cy='20' rx='6.2' ry='2.7' transform='rotate(-28 7 20)' fill='${c.lf}' stroke='${c.ln}' stroke-width='.5'/><ellipse cx='33' cy='20' rx='6.2' ry='2.7' transform='rotate(28 33 20)' fill='${c.lf}' stroke='${c.ln}' stroke-width='.5'/>${pet(5,3.5,6,13.8)}<circle cx='20' cy='20' r='3' fill='${c.ct}' stroke='${c.cs}' stroke-width='.6'/><circle cx='13' cy='11' r='1.1' fill='#fff'/><circle cx='27' cy='11' r='1.1' fill='#fff'/><circle cx='13' cy='29' r='1.1' fill='#fff'/><circle cx='27' cy='29' r='1.1' fill='#fff'/><rect width='40' height='3' fill='${c.ln}'/><rect y='4.2' width='40' height='.9' fill='#fff'/><rect y='37' width='40' height='3' fill='${c.ln}'/><rect y='34.9' width='40' height='.9' fill='#fff'/></g>`;
  const C=`<g id='C'><rect width='40' height='40' fill='${c.bg}'/><circle cx='20' cy='20' r='16' fill='${c.md}' stroke='${c.ln}' stroke-width='.9'/><circle cx='20' cy='20' r='13' fill='none' stroke='#fff' stroke-opacity='.7' stroke-width='.8' stroke-dasharray='1.6 1.6'/>${pet(8,3.3,6.4,13)}<circle cx='20' cy='20' r='4' fill='${c.ct}' stroke='${c.cs}' stroke-width='.8'/><circle cx='20' cy='20' r='1.4' fill='${c.cd}'/><rect width='40' height='3' fill='${c.ln}'/><rect width='3' height='40' fill='${c.ln}'/><rect x='37' y='37' width='3' height='3' fill='${c.ln}'/></g>`;
  const u=(id,t)=>`<use xlink:href='#${id}' href='#${id}'${t?` transform='${t}'`:''}/>`;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='120' height='120' viewBox='0 0 120 120'><defs>${E}${C}</defs>${u('E','translate(40 0)')}${u('E','translate(40 120) scale(1 -1)')}${u('E','matrix(0 1 1 0 0 40)')}${u('E','matrix(0 1 -1 0 120 40)')}${u('C')}${u('C','translate(120 0) scale(-1 1)')}${u('C','translate(0 120) scale(1 -1)')}${u('C','translate(120 120) scale(-1 -1)')}</svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
const S=JSON.parse(localStorage.getItem('rub3')||'{}');
const ST={v:2,theme:S.theme||(S.dark?'night':'light'),frame:S.v===2?(S.frame||'plain'):'plain',shade:S.shade!==false,veil:S.veil||.78,mode:S.mode||'stop',tfs:S.tfs||16,dl:S.dl||0};
let rub=+new URLSearchParams(location.search).get('r')||S.rub||1, ayahs=[], TAF=[], cur=-1, playing=false, first=true, zoomed=false, LASTQ=null;
$('rec').value=S.rec||'Alafasy_128kbps';
const save=()=>localStorage.setItem('rub3',JSON.stringify({rub,rec:$('rec').value,...ST}));
function applyTheme(){const t=TH[ST.theme]||TH.light,r=document.documentElement;
  for(const k of ['soft','paper','bar','ink','green','gold'])r.style.setProperty('--'+k,t[k]);

function ayRects(p,g){
  if(!MK||!MK[p])return null;
  const m=MK[p],b=CUM[p],n=m.length,e=g-b,s=g-1-b;
  if(e<1||s>n)return null;
  const S=s>=1?m[s-1]:null,E=e<=n?m[e-1]:null,R=[];
  if(S&&E&&Math.abs(S[2]-E[2])<10){R.push([E[0],S[2],S[0]-E[0],S[3]-S[2]]);return R;}

  if(y1>y0)R.push([0,y0,1000,y1-y0]);

const MODES={stop:'يقف في آخر الربع',repeat:'يكرر الربع',next:'يكمل للربع اللي بعده'};
function buildSettings(){
  const th=Object.entries(TH).map(([k,v])=>'<button class="chip'+(ST.theme===k?' on':'')+'" data-th="'+k+'"><span class="sw" style="background:linear-gradient(90deg,'+v.paper+' 0 50%,'+v.bar+' 50%)"></span>'+v.n+'</button>').join('');
  const fr='<button class="chip'+(ST.frame==='plain'?' on':'')+'" data-fr="plain">خط ذهبي مزدوج</button>'+Object.entries(PAL).map(([k,v])=>'<button class="chip'+(ST.frame===k?' on':'')+'" data-fr="'+k+'">'+swatch(v)+v.n+'</button>').join('')+'<button class="chip'+(ST.frame==='none'?' on':'')+'" data-fr="none">بدون إطار</button>';
  const md=Object.entries(MODES).map(([k,v])=>'<button class="chip'+(ST.mode===k?' on':'')+'" data-md="'+k+'">'+v+'</button>').join('');
  $('setb').innerHTML='<h4>المظهر</h4><div class="chips">'+th+'</div><h4>الإطار</h4><div class="chips">'+fr+'</div>'+
   '<h4>تظليل ما خارج الربع</h4><div class="row"><span>إخفاء الآيات اللي مش في الربع</span><button class="tg'+(ST.shade?' on':'')+'" id="tgs" aria-label="تظليل"></button></div>'+
   '<div class="row"><span>القوة</span><input type="range" id="vs" min="45" max="95" value="'+Math.round(ST.veil*100)+'"></div>'+
   '<h4>الاستماع</h4><div class="chips">'+md+'</div>'+
   '<h4>التفسير</h4><div class="row"><span>حجم الخط</span><input type="range" id="tfs" min="13" max="26" value="'+ST.tfs+'"></div>'+
   '<h4>القراءة بدون إنترنت</h4><div id="dlinfo" class="row"><span>…</span></div><div class="bar"><i id="dlbar"></i></div><div class="chips"><button class="btn" id="dlgo">تحميل كل الصفحات والتفسير</button><button class="btn o" id="dlclr">مسح</button></div><p style="border:0;font-size:15px;opacity:.8">حوالي ١٠٠ ميجا. التلاوة والبحث بيحتاجوا إنترنت.</p>';
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{ST.theme=b.dataset.th;applyTheme();save();buildSettings();});
  document.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{ST.frame=b.dataset.fr;applyFrame();save();buildSettings();setTimeout(fitScale,50);});
  document.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{ST.mode=b.dataset.md;save();buildSettings();});
  $('tgs').onclick=()=>{ST.shade=!ST.shade;save();buildSettings();if(LASTQ)pages(LASTQ);};
  $('vs').oninput=e=>{ST.veil=e.target.value/100;document.documentElement.style.setProperty('--veil',ST.veil);};
  $('vs').onchange=save;
  $('tfs').oninput=e=>{ST.tfs=+e.target.value;document.documentElement.style.setProperty('--tfs',ST.tfs+'px');};$('tfs').onchange=save;
  $('dlgo').onclick=()=>dl.on?dlStop():dlStart();$('dlclr').onclick=dlClear;
  dlInfo();
}
$('gear').onclick=()=>{buildSettings();openS('set');};
$('setc').onclick=closeAll;
// ---------- تحميل للقراءة بدون إنترنت ----------
const dl={on:false,stop:false,done:0,total:0};
const abs=u=>new URL(u,location.href).href;
async function dlInfo(){
  if(!('caches'in window)){$('dlinfo').innerHTML='<span>المتصفح مش بيدعم التحميل.</span>';$('dlgo').style.display='none';return;}
  try{const c=await caches.open('rub3-img'),k=await c.keys(),s=new Set();
    k.forEach(r=>{const m=r.url.match(/(\d+)\.webp/);if(m)s.add(+m[1]);});
    const n=Math.min(s.size,604),done=n>=604&&ST.dl;
    if(!dl.on){$('dlinfo').innerHTML='<span>الصفحات المحفوظة: '+ar(n)+' / ٦٠٤</span>';$('dlbar').style.width=(n/6.04)+'%';
      const g=$('dlgo');g.disabled=done;g.textContent=done?'تم التحميل ✓':'تحميل كل الصفحات والتفسير';}
  }catch(e){}
}
async function dlStart(){
  dl.on=true;dl.stop=false;dl.done=0;$('dlgo').textContent='⏹ إيقاف';
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  const img=await caches.open('rub3-img'),dat=await caches.open('rub3-data');
  const jobs=[];
  for(let p=1;p<=604;p++)jobs.push({c:img,u:abs(cand(p)[GOOD])});
  for(let q=1;q<=240;q++){jobs.push({c:dat,u:AQ+q+'/quran-uthmani'});jobs.push({c:dat,u:AQ+q+'/ar.muyassar'});}
  for(let s=1;s<=114;s++)jobs.push({c:dat,u:API+'surah/'+s+'/quran-uthmani'});
  dl.total=jobs.length;let idx=0,fail=0;
  const upd=()=>{const e=$('dlbar');if(e){e.style.width=(dl.done/dl.total*100)+'%';const i=$('dlinfo');if(i)i.innerHTML='<span>جارٍ التحميل: '+ar(dl.done)+' / '+ar(dl.total)+' ملف'+(fail?' (فشل '+ar(fail)+')':'')+'</span>';}};
  const worker=async()=>{while(!dl.stop&&idx<jobs.length){const j=jobs[idx++];
    try{if(!(await j.c.match(j.u))){const r=await fetch(j.u);if(r.ok)await j.c.put(j.u,r);else fail++;}}catch(e){fail++;}
    dl.done++;upd();}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  dl.on=false;if($('dlgo'))$('dlgo').textContent='تحميل كل الصفحات والتفسير';
  if(!dl.stop&&!fail){ST.dl=1;save();}toast(dl.stop?'اتوقف التحميل':(fail?'خلص مع بعض الأخطاء — أعد المحاولة':'تم التحميل ✓'));dlInfo();
}
function dlStop(){dl.stop=true;}
async function dlClear(){if(!confirm('مسح كل الصفحات المحفوظة؟'))return;dl.stop=true;try{await caches.delete('rub3-img');await caches.delete('rub3-data');}catch(e){}ST.dl=0;save();toast('تم المسح');dlInfo();}
// ---------- الاستماع ----------
const aud=$('aud');
function mark(i){const x=ayahs[i];$('np').style.display='block';$('np').textContent='▶ سورة '+SN[x.sn-1]+' · آية '+ar(x.numberInSurah);
  const mp=hlAyah(x.number)||document.querySelector('.mp[data-p="'+x.page+'"]');
  if(mp&&!zoomed)mp.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
function endOfRub(){
  if(ST.mode==='repeat'){playAt(0);return;}
  if(ST.mode==='next'&&rub<240){go(rub+1).then(()=>playAt(0));return;}
  stopAudio();toast('خلص الربع');
}
function playAt(i){
  if(i>=ayahs.length){endOfRub();return;}
  stopTaf();selI=-1;$('sel').style.display='none';cur=i;playing=true;const x=ayahs[i];
  aud.src='https://everyayah.com/data/'+$('rec').value+'/'+p3(x.sn)+p3(x.numberInSurah)+'.mp3';
  aud.play().catch(()=>stopAudio());mark(i);$('play').innerHTML='<i>⏸</i>إيقاف';}
function stopAudio(){playing=false;aud.pause();cur=-1;clearHl();$('np').style.display='none';$('play').innerHTML='<i>▶</i>استماع';}
aud.onended=()=>playAt(cur+1);
$('play').onclick=()=>{if(playing)stopAudio();else playAt(0);};
async function wake(){try{await navigator.wakeLock.request('screen');}catch(e){}}
wake();document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
go(rub);
</script>
